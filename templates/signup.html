<!DOCTYPE html>
<html>
<head>
    <title>Signup - Astra AI</title>

    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Create Account</h2>

    <form method="POST">
        <input type="email" name="email" placeholder="Enter Email" required><br>
        <input type="password" name="password" placeholder="Create Password" required><br>

        <button type="submit">Signup</button>
    </form>

    <br>

    <a href="/login">Already have an account? Login</a>

</div>

</body>
</html>
