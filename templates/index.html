<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Astra AI Assistant</title>

    <!-- Main chat styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Astra floating avatar styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='anya.css') }}">

    <style>
    /* ===== ASTRA INSTRUCTIONS (LEFT SIDE FIXED) ===== */
    #anya-instructions {
        position: fixed;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 998;
        font-size: 14px;
        font-weight: 500;
        color: #444;
    }

    .instruction-box {
        background: rgba(255, 255, 255, 0.95);
        padding: 12px 18px;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        width: 220px;
    }

    .instruction-box p {
        margin: 8px 0;
    }
    </style>
</head>

<body>

    <!-- ================= FLOATING ASTRA ================= -->
    <div id="anya-container">
        <img
            id="anya-avatar"
            src="{{ url_for('static', filename='anya_idle.gif') }}"
            alt="Astra AI"
        />
        <div class="anya-name">Astra</div>
    </div>

    <!-- ================= INSTRUCTIONS ================= -->
    <div id="anya-instructions">
        <div class="instruction-box">
            <p>🎤 Single Click Astra → Voice Chat</p>
            <p>💬 Double Click Astra → Open Chat Interface</p>
        </div>
    </div>

    <!-- ================= CHAT UI ================= -->
    <div class="chat-container hidden" id="chat-ui">

        <div class="chat-header">💬 Chat with Astra</div>

        <!-- 🔊 VOICE TOGGLE -->
        <div style="text-align: right; padding: 5px;">
            <button id="voice-toggle" onclick="toggleVoice()">
                🔇 Voice OFF
            </button>
        </div>

        <!-- ================= CHAT BOX ================= -->
        <div id="chat-box">

            {% if chats %}
                {% for role, message in chats %}
                    <div class="message {{ role }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

        </div>

        <!-- ================= INPUT ================= -->
        <div class="input-container">

            <input
                type="text"
                id="user-input"
                placeholder="Type or speak..."
            />

            <!-- 🎤 Voice Input -->
            <button onclick="startVoiceInput()">🎤</button>

            <!-- 📤 Send -->
            <button onclick="sendMessage()">Send</button>

        </div>

    </div>

    <!-- ================= SCRIPTS ================= -->

    <!-- Chat logic -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <!-- Voice (TTS + STT) -->
    <script src="{{ url_for('static', filename='voice.js') }}"></script>

    <!-- Astra click behavior -->
    <script src="{{ url_for('static', filename='anya.js') }}"></script>

    <!-- Emotion system -->
    <script src="{{ url_for('static', filename='anya_emotion.js') }}"></script>

</body>
</html>
