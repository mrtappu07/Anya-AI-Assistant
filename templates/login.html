<!DOCTYPE html>
<html>
<head>
    <title>Login - Astra AI</title>

    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 30px;
            width: 320px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .login-btn {
            background: #4CAF50;
            color: white;
        }

        .google-btn {
            background: #db4437;
            color: white;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Login to Astra AI</h2>

    <!-- 🔹 Email Login -->
    <form method="POST" action="/login">
        <input type="email" name="email" placeholder="Enter Email" required><br>
        <input type="password" name="password" placeholder="Enter Password" required><br>

        <button class="login-btn" type="submit">Login</button>
    </form>

    <!-- 🔥 Divider -->
    <p>---------------- OR ----------------</p>

    <!-- 🔴 Google Login -->
    <a href="/login/google">
        <button class="google-btn">
            🔴 Login with Google
        </button>
    </a>

    <br><br>

    <!-- 🆕 Signup Link -->
    <a href="/signup">Create new account</a>

</div>

</body>
</html>
